<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design D — 3D Tilting Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #fafafa 0%, #f1f5f9 50%, #e8f5e9 100%);
    font-family: 'Outfit', sans-serif;
    padding: 40px 20px;
    perspective: 1200px;
  }
  .card-container {
    max-width: 640px;
    width: 100%;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(47,111,94,0.08);
    border-radius: 32px;
    padding: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.06);
  }

  .header { margin-bottom: 28px; }
  .header-top { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
  .header-icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, #2F6F5F, #4ade80);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 6px 20px rgba(47,111,94,0.3);
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .header-text h2 {
    font-size: 26px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -0.5px;
  }
  .header-text .sub { font-size: 12px; color: #94a3b8; font-weight: 500; }

  .disease-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
  .disease-card {
    position: relative;
    padding: 20px 16px 16px;
    border-radius: 20px;
    background: white;
    border: 1.5px solid #f1f5f9;
    cursor: pointer;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    text-align: center;
    overflow: hidden;
  }
  .disease-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(47,111,94,0.0) 0%, rgba(47,111,94,0.06) 100%);
    opacity: 0;
    transition: opacity 0.4s;
  }
  .disease-card:hover::before { opacity: 1; }
  .disease-card:hover {
    transform: translateY(-8px) rotateX(2deg);
    border-color: #2F6F5F;
    box-shadow: 
      0 20px 40px rgba(47,111,94,0.12),
      0 0 0 1px rgba(47,111,94,0.1),
      inset 0 -2px 6px rgba(47,111,94,0.04);
  }

  .card-emoji {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, #f0fdf4, #dcfce7);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-bottom: 12px;
    transition: all 0.4s;
  }
  .disease-card:hover .card-emoji {
    transform: scale(1.15) rotate(-5deg);
    background: linear-gradient(135deg, #2F6F5F, #4ade80);
    box-shadow: 0 6px 16px rgba(47,111,94,0.25);
  }
  .card-name {
    font-size: 12px;
    font-weight: 700;
    color: #334155;
    line-height: 1.3;
    position: relative;
    z-index: 1;
    transition: color 0.3s;
  }
  .disease-card:hover .card-name { color: #2F6F5F; }

  .card-shimmer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #2F6F5F, #4ade80, transparent);
    transform: scaleX(0);
    transition: transform 0.5s;
  }
  .disease-card:hover .card-shimmer { transform: scaleX(1); }

  .footer { display: flex; align-items: center; justify-content: space-between; padding-top: 16px; border-top: 1px solid #f1f5f9; }
  .counter-badge {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .counter-num {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #2F6F5F, #3b9b7d);
    color: white;
    font-size: 16px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .counter-text { font-size: 11px; color: #64748b; font-weight: 600; line-height: 1.3; }
  .counter-text strong { color: #1e293b; font-weight: 800; }
  .view-all {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 22px;
    border-radius: 14px;
    background: white;
    border: 2px solid #2F6F5F;
    color: #2F6F5F;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.3s;
  }
  .view-all:hover { background: #2F6F5F; color: white; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(47,111,94,0.3); }
  .design-label { position: fixed; top: 20px; left: 20px; background: rgba(47,111,94,0.9); color: white; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; z-index: 100; }
</style>
</head>
<body>
  <div class="design-label">Design D — 3D Tilting Cards</div>
  <div class="card-container">
    <div class="header">
      <div class="header-top">
        <div class="header-icon">🩺</div>
        <div class="header-text">
          <h2>Diseases We Treat</h2>
          <p class="sub">Tap any condition for expert clinical insights</p>
        </div>
      </div>
    </div>

    <div class="disease-grid">
      <div class="disease-card">
        <div class="card-emoji">🩸</div>
        <div class="card-name">Diabetes (DM)</div>
        <div class="card-shimmer"></div>
      </div>
      <div class="disease-card">
        <div class="card-emoji">❤️</div>
        <div class="card-name">Hypertension (HTN)</div>
        <div class="card-shimmer"></div>
      </div>
      <div class="disease-card">
        <div class="card-emoji">🧬</div>
        <div class="card-name">Dyslipidemia</div>
        <div class="card-shimmer"></div>
      </div>
      <div class="disease-card">
        <div class="card-emoji">💓</div>
        <div class="card-name">Ischemic Heart Disease</div>
        <div class="card-shimmer"></div>
      </div>
      <div class="disease-card">
        <div class="card-emoji">🫀</div>
        <div class="card-name">Fatty Liver Disease</div>
        <div class="card-shimmer"></div>
      </div>
      <div class="disease-card">
        <div class="card-emoji">🌡️</div>
        <div class="card-name">Enteric Fever (Typhoid)</div>
        <div class="card-shimmer"></div>
      </div>
    </div>

    <div class="footer">
      <div class="counter-badge">
        <div class="counter-num">15</div>
        <div class="counter-text"><strong>Total Conditions</strong><br>Evidence-based care</div>
      </div>
      <a href="#" class="view-all">View All →</a>
    </div>
  </div>
</body>
</html>

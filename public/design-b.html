<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design B — Floating Orbit Pills</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(170deg, #f0fdf4 0%, #ecfdf5 30%, #f8fafc 100%);
    font-family: 'Outfit', sans-serif;
    padding: 40px 20px;
  }
  .card-container {
    max-width: 620px;
    width: 100%;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(24px) saturate(150%);
    border: 1px solid rgba(47,111,94,0.12);
    border-radius: 32px;
    padding: 40px;
    box-shadow: 0 4px 60px rgba(47,111,94,0.08), 0 1px 3px rgba(0,0,0,0.04);
    position: relative;
    overflow: hidden;
  }
  .card-container::before {
    content: '';
    position: absolute;
    top: -50%; right: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 70% 30%, rgba(47,111,94,0.04) 0%, transparent 50%);
    pointer-events: none;
  }

  .header { text-align: center; margin-bottom: 32px; position: relative; z-index: 1; }
  .icon-ring {
    width: 52px; height: 52px;
    border-radius: 16px;
    background: linear-gradient(135deg, #2F6F5F, #3b9b7d);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(47,111,94,0.25);
  }
  .icon-ring svg { width: 24px; height: 24px; color: white; }
  h2 {
    font-size: 28px;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 6px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    font-size: 13px;
    color: #64748b;
    font-weight: 500;
  }

  .pills-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    border-radius: 100px;
    background: white;
    border: 1.5px solid #e2e8f0;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  .pill::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 100px;
    background: linear-gradient(135deg, rgba(47,111,94,0.08), rgba(59,155,125,0.05));
    opacity: 0;
    transition: opacity 0.4s;
  }
  .pill:hover::after { opacity: 1; }
  .pill:hover {
    border-color: #2F6F5F;
    transform: translateY(-4px) scale(1.03);
    box-shadow: 0 12px 32px rgba(47,111,94,0.18), 0 0 0 4px rgba(47,111,94,0.06);
  }
  .pill-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f0fdf4, #dcfce7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.3s;
    flex-shrink: 0;
  }
  .pill:hover .pill-icon {
    background: linear-gradient(135deg, #2F6F5F, #3b9b7d);
    transform: rotate(10deg) scale(1.1);
  }
  .pill:hover .pill-icon span { filter: brightness(10); }
  .pill-text {
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    position: relative;
    z-index: 1;
    transition: color 0.3s;
    white-space: nowrap;
  }
  .pill:hover .pill-text { color: #2F6F5F; }

  .footer { text-align: center; position: relative; z-index: 1; }
  .count-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 6px;
    background: #f0fdf4;
    color: #2F6F5F;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .view-all {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border-radius: 100px;
    background: linear-gradient(135deg, #2F6F5F, #1f5244);
    color: white;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(47,111,94,0.3);
  }
  .view-all:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(47,111,94,0.4); }
  .design-label { position: fixed; top: 20px; left: 20px; background: rgba(47,111,94,0.9); color: white; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; z-index: 100; }
</style>
</head>
<body>
  <div class="design-label">Design B — Floating Orbit Pills</div>
  <div class="card-container">
    <div class="header">
      <div class="icon-ring">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
      </div>
      <h2>Diseases We Treat</h2>
      <p class="subtitle">Tap any condition for expert clinical insights</p>
    </div>

    <div class="pills-container">
      <div class="pill">
        <div class="pill-icon"><span>🩸</span></div>
        <span class="pill-text">Diabetes (DM)</span>
      </div>
      <div class="pill">
        <div class="pill-icon"><span>❤️</span></div>
        <span class="pill-text">Hypertension (HTN)</span>
      </div>
      <div class="pill">
        <div class="pill-icon"><span>🧬</span></div>
        <span class="pill-text">Dyslipidemia</span>
      </div>
      <div class="pill">
        <div class="pill-icon"><span>💓</span></div>
        <span class="pill-text">Ischemic Heart Disease</span>
      </div>
      <div class="pill">
        <div class="pill-icon"><span>🫀</span></div>
        <span class="pill-text">Fatty Liver Disease</span>
      </div>
      <div class="pill">
        <div class="pill-icon"><span>🌡️</span></div>
        <span class="pill-text">Enteric Fever (Typhoid)</span>
      </div>
    </div>

    <div class="footer">
      <div class="count-badge">15 Diseases Available</div><br>
      <a href="#" class="view-all">View All 15 Diseases →</a>
    </div>
  </div>
</body>
</html>
